actions: 
  - action: delete_indices
    description: action1 delete selected indices 
    options: 
      disable_action: false
    filters:
    - filtertype: age
      source: creation_date
      direction: older
      unit: days
      unit_count: 1
    - filtertype: pattern
      kind: prefix
      value: prefixmore
      exclude: 
    - filtertype: space
      disk_space: 2
      use_age: True
      source: creation_date

  - action: close
    description: action1 close selected indices
    options: 
      disable_action: true
    filters:
    - filtertype: age
      source: creation_date
      direction: older
      unit: days
      unit_count: 1
    - filtertype: pattern
      kind: prefix
      value: prefixmore
      exclude:

  - action: open
    description: action1 open selected indices
    options: 
      disable_action: true
    filters:
    - filtertype: age
      source: creation_date
      direction: older
      unit: days
      unit_count: 1
    - filtertype: pattern
      kind: prefix
      value: prefixmore
      exclude:

