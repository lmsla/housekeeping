actions:
  - action: delete_indices
    description: delete selected indices
    options:
      disable_action: true
      delay: 5
    filters:
    - filtertype: pattern
      kind: prefix
      value: logstash-sevone-sn
    - filtertype: space
      disk_space: 650
    # - filtertype: age
    #   source: creation_date
    #   direction: range
    #   unit: days
    #   range_from: 2
    #   range_to: 1

  - action: allocation
    description:  allocate selected indices at data_hot
    options:
      disable_action: false
      key: _tier_preference
      value: data_hot
      allocation_type: include
      delay: 5
    filters:
    - filtertype: pattern
      kind: prefix
      value: logstash
    # - filtertype: node_role
    #   value: h
    - filtertype: space
      disk_space: 1

  - action: allocation
    description:  allocation selected indices in selected node to data_warm12
    options:
      disable_action: true
      key: _tier_preference
      value: data_hot
      allocation_type: include
      delay: 5
    filters:
    - filtertype: pattern
      kind: prefix
      value: logstash-l7_network5-20240731    
    - filtertype: node_role
      value: w
