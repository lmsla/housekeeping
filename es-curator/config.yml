#### timestring "2006-01-02 15:04:05"
actions:
  - action: delete_indices
    description: delete selected indices
    options:
      disable_action: false
      delay: 5
    filters:
    - filtertype: pattern
      kind: regex
      value: '-\d{8}'
    # - filtertype: node_role
    #   value: w
    - filtertype: water_level
      upper_limit: 23
      lower_limit: 15
    # - filtertype: age
    #   source: creation_date
    #   direction: range
    #   unit: days
    #   range_from: 2
    #   range_to: 1
  - action: delete_indices
    description: delete selected indices
    options:
      disable_action: true
      delay: 5
    filters:
    - filtertype: pattern
      kind: prefix
      value: logstash
    # - filtertype: space
    #   disk_space: 15
    - filtertype: age
      source: creation_date
      direction: range
      unit: days
      range_from: 2
      range_to: 1    

  - action: allocation
    description:  allocate selected indices at data_hot
    options:
      disable_action: true
      key: _tier_preference
      value: data_hot
      allocation_type: include
      delay: 5
    filters:
    - filtertype: pattern
      kind: regex
      value: '-\d{8}'
    # - filtertype: node_role
    #   value: w
    - filtertype: water_level
      upper_limit: 90
      lower_limit: 15
    # - filtertype: space
    #   disk_space: 20

  - action: allocation
    description:  allocation selected indices in selected node to data_warm12
    options:
      disable_action: true
      key: _tier_preference
      value: data_warm
      allocation_type: include
      delay: 5
    filters:
    - filtertype: pattern
      kind: prefix
      value: logstash-l7_network
    - filtertype: node_role
      value: h
    # - filtertype: pattern
    #   kind: regex
    #   value: 
    #    - '[a-z]*-.{2}\_\w{7}5\-\d{8}'
    #    - '[a-z]*-.{2}\_\w{7}4\-\d{8}'

