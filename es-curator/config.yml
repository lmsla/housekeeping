#### timestring "2006-01-02 15:04:05"
actions:

  - action: delete_indices
    description: delete indices when cluster used space greater than 20G
    options:
      disable_action: false
      delay: 5
    filters:
    - filtertype: pattern
      kind: prefix
      value: logstash-
    - filtertype: space
      disk_space: 10

  - action: delete_indices
    description: delete selected indices
    options:
      disable_action: true
      delay: 5
    filters:
    - filtertype: pattern
      kind: regex
      value: '-\d{8}'
    - filtertype: node_role
      value: h
    # - filtertype: water_level
    #   upper_limit: 20
    #   lower_limit: 15
    # - filtertype: age
    #   source: creation_date
    #   direction: younger
    #   unit: days
    #   unit_count: 1

  - action: delete_indices
    description: delete selected indices
    options:
      disable_action: true
      delay: 5
    filters:
    - filtertype: pattern
      kind: prefix
      value: logstash
    # - filtertype: space
    #   disk_space: 15
    - filtertype: age
      source: creation_date
      direction: range
      unit: days
      range_from: 2
      range_to: 1

  - action: allocation
    description:  allocate selected indices at data_hot
    options:
      disable_action: false
      key: _tier_preference
      value: data_warm
      allocation_type: include
      delay: 5
    filters:
    - filtertype: pattern
      kind: regex
      # value: '-\d{8}'
      value: 'logstash-ubuntu'
    # - filtertype: node_role
    #   value: w
    # - filtertype: water_level
    #   upper_limit: 90
    #   lower_limit: 15
    # - filtertype: space
    #   disk_space: 20

  - action: allocation
    description:  allocation selected indices in selected node to data_warm12
    options:
      disable_action: true
      key: _tier_preference
      value: data_warm
      allocation_type: include
      delay: 5
    filters:
    - filtertype: pattern
      kind: prefix
      value: logstash-l7_network
    - filtertype: node_role
      value: h
