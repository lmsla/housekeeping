  - action: shrink
    description:  allocation routing to warm node setup for *-h indices older than 1 days, based on index-name3
    options:
      wait_for_completion: True
      key: box_type
      value: tansfer
      allocation_type: require
    filters:
      - filtertype: pattern
        kind: suffix
        value: h
      - filtertype: period
        source: name
        range_from: -15
        range_to: -15
        timestring: '%Y.%m.%d'
        unit: days






