  - action: close
    description: close selected indices
    options: 
      disable_action: true
    filters:
    - filtertype: age
      source: creation_date
      direction: older
      unit: days
      unit_count: 1
    - filtertype: pattern
      kind: prefix
      value: prefixmore
      exclude:

  - action: open
    description: open selected indices
    options: 
      disable_action: true
    filters:
    - filtertype: age
      source: creation_date
      direction: older
      unit: days
      unit_count: 1
    - filtertype: pattern
      kind: prefix
      value: prefixmore
      exclude:

