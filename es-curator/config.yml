actions:

  - action: rollover
    description: "Daily logs rollover"
    options:
      disable_action: false
      rollover_alias: "mock-data"
      max_age: "1d"
      max_size: "1gb"
      delay: 10
        #new_index_name: "logstash-mock-data-roll"

  - action: delete_indices
    description: delete indices when cluster used space greater than 150G
    options:
      disable_action: false
      delay: 5
    filters:
    - filtertype: pattern
      kind: prefix
      value: logstash-
    - filtertype: space
      disk_space: 110
    # - filtertype: age
    #   source: creation_date
    #   direction: range
    #   unit: days
    #   range_from: 2
    #   range_to: 1


