  - action: allocation
    description:  allocation routing to warm node setup for *-h indices older than 1 days, based on index-name1
    options:
      disable_action: True
      wait_for_completion: True
      key: _tier_preference
      value: data_hot
      allocation_type: include
      delay: 20
    filters:
    - filtertype: pattern
      kind: prefix
      value: logstash-zs

  - action: forcemerge
    description: Perform a forceMerge on selected indices to 'max_num_segments' per shard
    options:
      disable_action: true
      max_num_segment: 1
      delay: 10
    filters:
    - filtertype: pattern
      kind: prefix
      value: logstash-zs
      exclude:

  - action: delete_indices
    description: delete selected indices1
    options: 
      disable_action: true
    filters:
    - filtertype: pattern
      kind: prefix
      value: logstash-zs
      exclude: 

