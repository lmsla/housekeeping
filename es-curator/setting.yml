es:
  ## 連接的 es 地址
  url:
    - https://10.99.1.213:9200

  ## 帳號
  #sourceAccount: "housekeeping"
  sourceAccount: "elastic"
  ## 密碼
  #sourcePassword: "elastic"
  sourcePassword: "a12345678"

  ## 啟動時 ES 連接最大重試次數（預設 5）
  ## 重試間隔: 1s, 2s, 4s, 8s, 16s (指數退避)
  ## 總等待時間最多約 31 秒
  max_retries: 5

information:
  ## 是否為測試模式
  test_mode: false
  ## 執行時間
  period: "*/5 * * * *"
  ## 是否執行排程
  execute_cron : false

log:
  ## 是否同時將log輸出至 es 
  toes: true
  ## 健康檢查間隔
  health_check_interval: 60
  ## log 路徑
  path: "/Users/chen/Downloads/01BiMap/02gitlab/bimap-product/housekeeping/es-curator/log"
  ## 最大大小
  maxSize: 10
  ## 最大備份數量
  maxBackups: 0
  ## 最大保存天數
  maxAge: 30
  ## 是否為 debug 模式
  debug: false 